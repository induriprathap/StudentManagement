{% extends "students/base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Heading -->

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Create Account
            </h1>

            <p class="text-gray-500 mt-2">
                Register to use the Student Management System
            </p>

        </div>


        <!-- Registration Form -->

        <form method="POST"
              class="!max-w-none !mx-0 !my-0
                     !bg-white !p-8
                     rounded-2xl
                     shadow-sm
                     border border-gray-100">

            {% csrf_token %}


            <!-- Form Fields -->

            <div class="space-y-5

                        [&_input]:w-full
                        [&_input]:border
                        [&_input]:border-gray-300
                        [&_input]:rounded-lg
                        [&_input]:px-4
                        [&_input]:py-3
                        [&_input]:mt-1
                        [&_input]:box-border

                        [&_input]:focus:outline-none
                        [&_input]:focus:ring-2
                        [&_input]:focus:ring-blue-500

                        [&_label]:font-medium
                        [&_label]:text-gray-700

                        [&_.helptext]:text-sm
                        [&_.helptext]:text-gray-500">

                {{ form.as_p }}

            </div>


            <!-- Register Button -->

            <button type="submit"
                    class="w-full mt-6
                           bg-blue-600
                           text-white
                           font-medium
                           px-5 py-3
                           rounded-lg
                           hover:bg-blue-700
                           transition">

                Create Account

            </button>

        </form>


        <!-- Login Link -->

        <p class="text-center text-gray-500 mt-6">

            Already have an account?

            <a href="{% url 'login' %}"
               class="text-blue-600
                      font-medium
                      hover:text-blue-800">

                Login

            </a>

        </p>

    </div>

</div>

{% endblock %}

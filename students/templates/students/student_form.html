{% extends "students/base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto px-4 py-10">

    <!-- Page Heading -->

    <div class="mb-8">

        <h1 class="text-3xl font-bold text-gray-800">
            Add Student
        </h1>

        <p class="text-gray-500 mt-2">
            Enter the student's details below.
        </p>

    </div>


    <!-- Student Form -->

    <form method="POST"
          class="!max-w-none !mx-0 !my-0 !bg-white
                 !p-8 rounded-xl shadow-sm
                 border border-gray-100
                 space-y-4">

        {% csrf_token %}


        <!-- Django Form -->

        <div class="[&_input]:w-full
                    [&_input]:border
                    [&_input]:border-gray-300
                    [&_input]:rounded-lg
                    [&_input]:px-4
                    [&_input]:py-3
                    [&_input]:mt-1
                    [&_input]:focus:outline-none
                    [&_input]:focus:ring-2
                    [&_input]:focus:ring-blue-500

                    [&_select]:w-full
                    [&_select]:border
                    [&_select]:border-gray-300
                    [&_select]:rounded-lg
                    [&_select]:px-4
                    [&_select]:py-3
                    [&_select]:mt-1
                    [&_select]:bg-white
                    [&_select]:focus:outline-none
                    [&_select]:focus:ring-2
                    [&_select]:focus:ring-blue-500

                    [&_label]:font-medium
                    [&_label]:text-gray-700">

            {{ form.as_p }}

        </div>


        <!-- Submit Button -->

        <button type="submit"
                class="w-full bg-blue-600
                       text-white font-medium
                       px-5 py-3 rounded-lg
                       hover:bg-blue-700
                       transition">

            Add Student

        </button>

    </form>


    <!-- Back Link -->

    <div class="mt-6">

        <a href="{% url 'student_list' %}"
           class="text-blue-600 hover:text-blue-800
                  font-medium">

            ← Back to Students

        </a>

    </div>

</div>

{% endblock %}

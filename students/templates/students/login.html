{% extends "students/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Heading -->

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Welcome Back
            </h1>

            <p class="text-gray-500 mt-2">
                Login to manage your students
            </p>

        </div>


        <!-- Login Card -->

        <form method="POST"
              class="!max-w-none !mx-0 !my-0
                     !bg-white !p-8
                     rounded-2xl shadow-sm
                     border border-gray-100">

            {% csrf_token %}


            <!-- Username & Password -->

            <div class="space-y-5

                        [&_input]:w-full
                        [&_input]:border
                        [&_input]:border-gray-300
                        [&_input]:rounded-lg
                        [&_input]:px-4
                        [&_input]:py-3
                        [&_input]:mt-1
                        [&_input]:box-border

                        [&_input]:focus:outline-none
                        [&_input]:focus:ring-2
                        [&_input]:focus:ring-blue-500

                        [&_label]:font-medium
                        [&_label]:text-gray-700">

                {{ form.as_p }}

            </div>


            <!-- Login Button -->

            <button type="submit"
                    class="w-full mt-6
                           bg-blue-600
                           text-white
                           font-medium
                           px-5 py-3
                           rounded-lg
                           hover:bg-blue-700
                           transition">

                Login

            </button>

        </form>


        <!-- Bottom Text -->

        <p class="text-center text-gray-500 text-sm mt-6">
            Student Management System
        </p>

    </div>

</div>

{% endblock %}
